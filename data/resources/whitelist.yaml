eponym_patterns:
  - "[A-ZÅÄÖ][a-zåäöéü]+s"                    # genitive eponym: Crohns, Parkinsons, Alzheimers
  - "[A-ZÅÄÖ][a-zåäöéü]+(-[A-ZÅÄÖ][a-zåäöéü]+)+s?"  # Guillain-Barré, Wolff-Parkinson-White
  - "[A-ZÅÄÖ][a-zåäöéü]+-?(syndrom|syndromet|sjukdom|sjukdomen|test|testet|tecken|tecknet|reflex|reflexen|cell|cellen|celler|cellerna)"

# Hand-written level-A equivalences (source "manual"): English term -> accepted Swedish forms.
# Only for frequent benchmark terms where the authoritative sources give a single form but
# Swedish clinical usage has an equally correct, established alternative.
manual_terms:
  type 2 diabetes mellitus: [typ 2-diabetes, diabetes mellitus typ 2, diabetes typ 2]
  type 2 diabetes: [typ 2-diabetes, diabetes mellitus typ 2, diabetes typ 2]
  type 1 diabetes mellitus: [typ 1-diabetes, diabetes mellitus typ 1, diabetes typ 1]
  type 1 diabetes: [typ 1-diabetes, diabetes mellitus typ 1, diabetes typ 1]
  metabolic acidosis: [metabolisk acidos, metabol acidos]
  metabolic alkalosis: [metabolisk alkalos, metabol alkalos]
  respiratory acidosis: [respiratorisk acidos]
  respiratory alkalosis: [respiratorisk alkalos]

