# Hand-written whitelist for the refinement loop.
#
# abbreviations / latin_anatomy / international_terms / extra_tokens:
#   tokens that are correct in Swedish clinical text even though they are not SALDO words
#   (Lexicon.whitelist = all of these, original case + lowercase). They are never leakage
#   candidates and never "non-Swedish tokens" in the gate.
# eponym_patterns: regexes (full-token match) for eponyms and genitive eponyms.
# ambiguous_en: English keys (normalised: lowercase, singular) that are general-English words or
#   have several clinical senses. Every term-base row with such an en_key gets single_sense=False,
#   so it never creates an obligation and never vetoes a finding (it is still a hint).
# keep: protected Swedish clinical terms. The same list is the
#   table "Protected terms" in style_guide_sv.md. Enforced in grounding (findings on these spans
#   are vetoed), in the gate (removed_protected_term) and in the judge prompts. Matching is
#   case-insensitive and whole-word (inflected forms included by the loop).

