[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swemedmcq"
version = "1.0.0"
description = "Paired English-Swedish medical multiple-choice benchmark: translation, refinement, distillation, training and evaluation code"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["swemedmcq*"]

[tool.setuptools.package-data]
"swemedmcq.refine" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
